services:

  BuronDigital\DeserializingConnection\Serializer\DeserializingConnection:
    autowire: true
    autoconfigure: true

  BuronDigital\DeserializingConnection\Serializer\DecodingConnection:
    autowire: true
    autoconfigure: true

  BuronDigital\DeserializingConnection\Serializer\TypedDenormalizer:
    autowire: true
    autoconfigure: true

  BuronDigital\DeserializingConnection\Serializer\ResultTransformerRunner:
    autowire: true
    autoconfigure: true

  # Profiler
  # Replaced with the profiling tracer through the ProfilerPass when the Symfony profiler is available.

  BuronDigital\DeserializingConnection\Profiler\NullTracer: ~

  BuronDigital\DeserializingConnection\Profiler\Tracer:
    alias: BuronDigital\DeserializingConnection\Profiler\NullTracer

  BuronDigital\DeserializingConnection\Profiler\ProfilingTracer:
    autowire: true
    autoconfigure: true

  BuronDigital\DeserializingConnection\Profiler\RunnableQueryRenderer:
    autowire: true
    autoconfigure: true

  BuronDigital\DeserializingConnection\Profiler\SqlHighlighter: ~

  BuronDigital\DeserializingConnection\Profiler\DeserializingConnectionDataCollector:
    autowire: true
    tags:
      - name: data_collector
        id: deserializing_connection
        template: '@DeserializingConnection/Collector/deserializing_connection.html.twig'
